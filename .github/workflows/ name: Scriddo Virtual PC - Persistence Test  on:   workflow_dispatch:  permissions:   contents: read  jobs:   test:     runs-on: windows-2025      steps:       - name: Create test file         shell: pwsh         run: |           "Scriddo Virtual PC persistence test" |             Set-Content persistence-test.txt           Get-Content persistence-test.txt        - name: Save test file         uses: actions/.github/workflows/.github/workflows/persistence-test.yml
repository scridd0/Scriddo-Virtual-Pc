
name: Scriddo Virtual PC - Persistence Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025

    steps:
      - name: Create test file
        shell: pwsh
        run: |
          "Scriddo Virtual PC persistence test" |
            Set-Content persistence-test.txt
          Get-Content persistence-test.txt

      - name: Save test file
        uses: actions/upload-artifact@v4
        with:
          name: scriddo-persistence-test
          path: persistence-test.txt
          retention-days: 7
